  <style>
    :root {
      --cream: #FAF0E6;
      --red:   #9B1D20;
      --dark:  #0d0d0d;
      --mid:   #444;
      --mute:  #777;
      --border: 1.5px solid #0d0d0d;
      --font-display: 'Barlow Condensed', sans-serif;
      --font-body:    'Barlow', sans-serif;
      --font-hand:    'Caveat', cursive;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); background: var(--cream); color: var(--dark); -webkit-font-smoothing: antialiased; font-size: 16px; }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }

    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: var(--border); position: sticky; top: 0; background: var(--cream); z-index: 100; }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .nav-name { font-family: var(--font-display); font-size: 16px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    .nav-links { display: flex; gap: 36px; }
    .nav-links a { font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--red); }
    .doodle-nav { width: 26px; height: 26px; flex-shrink: 0; display: block; }
    .hand-note { font-family: var(--font-hand); font-size: 19px; color: var(--red); line-height: 1.1; display: inline-block; }
    .hand-note.muted { color: var(--mid); }

    .back-row { padding: 20px 40px 0; }
    .back-link { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
    .back-link:hover { color: var(--red); }

    .page-header { padding: 24px 40px 40px; border-bottom: var(--border); }
    .page-eyebrow { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: var(--red); margin-bottom: 14px; }
    .page-title { font-family: var(--font-display); font-size: 56px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; line-height: .96; margin-bottom: 14px; }
    .page-meta { display: flex; gap: 16px; flex-wrap: wrap; }
    .meta-pill { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--mid); }
    .meta-pill:not(:last-child)::after { content: '·'; margin-left: 16px; color: var(--mute); }

    .sec { padding: 44px 40px; border-bottom: var(--border); }
    .project-desc { font-size: 16px; line-height: 1.85; color: var(--mid); max-width: 640px; margin-bottom: 28px; }
    .project-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 34px; }
    .project-tag { border: 1.5px solid var(--dark); padding: 6px 14px; font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }

    .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .video-item.full { grid-column: 1 / -1; }
    .video-embed { position: relative; width: 100%; aspect-ratio: 16/9; background: #111; }
    .video-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    .video-caption { font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin-top: 10px; }

    .stills-heading { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin: 34px 0 14px; }
    .stills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stills-grid img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #111; }

    .poster-wrap { display: flex; justify-content: flex-start; margin-bottom: 28px; }
    .poster-wrap img { max-width: 280px; width: 100%; height: auto; display: block; border: var(--border); }

    .ig-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .ig-tile { border: var(--border); padding: 18px; display: flex; align-items: center; gap: 14px; transition: background 0.2s; }
    .ig-tile:hover { background: rgba(155,29,32,0.04); }
    .ig-icon { font-size: 22px; color: var(--red); }
    .ig-tile-label { font-family: var(--font-display); font-size: 15px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--dark); margin-bottom: 4px; }
    .ig-tile-sub { font-size: 13px; color: var(--mute); }
    .ig-tile-arrow { margin-left: auto; font-size: 20px; color: var(--red); flex-shrink: 0; }

    .cta-sec { padding: 56px 40px; display: flex; justify-content: space-between; align-items: flex-end; }
    .cta-big { font-family: var(--font-display); font-size: 48px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; line-height: .95; color: var(--dark); }
    .cta-big span { color: var(--red); }
    .cta-btn { background: var(--red); color: var(--cream); font-family: var(--font-display); font-size: 14px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; padding: 16px 34px; border: none; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; display: inline-block; }
    .cta-btn:hover { opacity: 0.85; }

    footer { padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; }
    .ft-copy { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }

    .not-found { padding: 80px 40px; text-align: center; }
    .not-found .page-title { font-size: 40px; }

    @media (max-width: 768px) {
      nav { padding: 16px 20px; }
      .nav-links { gap: 20px; }
      .nav-links a { font-size: 11px; }
      .back-row, .page-header, .sec, .cta-sec, footer { padding-left: 20px; padding-right: 20px; }
      .page-title { font-size: 38px; }
      .video-grid, .ig-grid, .stills-grid { grid-template-columns: 1fr; }
      .cta-sec { flex-direction: column; align-items: flex-start; gap: 24px; }
    }
  </style>

    const CATEGORY_PAGES = { professional: "professional.html", creative: "creative.html", concert: "concert.html", "personal-work": "personal-work.html" };

    function ytEmbed(id, caption) {
      return `<div class="video-item">
        <div class="video-embed"><iframe src="https://www.youtube.com/embed/${id}" title="${caption}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
        <div class="video-caption">${caption}</div>
      </div>`;
    }
    function externalTile(url, label, sub) {
      return `<a class="ig-tile" href="${url}" target="_blank" rel="noopener">
        <div class="ig-icon">&#9658;</div>
        <div><div class="ig-tile-label">${label}</div><div class="ig-tile-sub">${sub}</div></div>
        <div class="ig-tile-arrow">&rarr;</div>
      </a>`;
    }

    function render() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const p = PROJECTS[id];
      const app = document.getElementById("app");

      if (!p) {
        app.innerHTML = `<div class="not-found">
          <div class="page-eyebrow" style="text-align:center">Not Found</div>
          <h1 class="page-title">Project not found.</h1>
          <p class="project-desc" style="margin:20px auto 0;text-align:center">Head back to <a href="index.html" style="color:var(--red)">the homepage</a>.</p>
        </div>`;
        return;
      }

      const backHref = CATEGORY_PAGES[p.category] || "index.html";
      let mediaHTML = "";
      const ytItems = p.media.filter(m => m.type === "youtube");
      const otherItems = p.media.filter(m => m.type !== "youtube");

      if (ytItems.length) {
        mediaHTML += `<div class="video-grid">${ytItems.map(m => ytEmbed(m.id, m.caption)).join("")}</div>`;
      }
      if (otherItems.length) {
        mediaHTML += `<div class="ig-grid" style="margin-top:${ytItems.length ? '16px' : '0'}">${otherItems.map(m =>
          externalTile(m.url, m.label || m.caption || "View", m.type === "instagram" ? "View on Instagram" : "View on Google Drive")
        ).join("")}</div>`;
      }
      if (!p.media.length) {
        mediaHTML = `<p class="hand-note muted">video coming soon — check back shortly</p>`;
      }

      let stillsHTML = "";
      if (p.stills && p.stills.length) {
        stillsHTML = `
          <div class="stills-heading">Stills</div>
          <div class="stills-grid">${p.stills.map(src => `<img src="${src}" alt="${p.title} still" loading="lazy" />`).join("")}</div>
        `;
      }

      const posterHTML = p.poster
        ? `<div class="poster-wrap"><img src="${p.poster}" alt="${p.title} poster" /></div>`
        : "";

      app.innerHTML = `
        <div class="back-row"><a href="${backHref}" class="back-link">&larr; Back to ${p.categoryLabel}</a></div>
        <div class="page-header">
          <div class="page-eyebrow">${p.categoryLabel}</div>
          <h1 class="page-title">${p.title}</h1>
          <div class="page-meta">${p.meta.map(m => `<span class="meta-pill">${m}</span>`).join("")}</div>
        </div>
        <div class="sec">
          ${posterHTML}
          <p class="project-desc">${p.desc}</p>
          <div class="project-tags">${p.tags.map(t => `<span class="project-tag">${t}</span>`).join("")}</div>
          ${mediaHTML}
          ${stillsHTML}
        </div>
        <div class="cta-sec">
          <div class="cta-big">Like what<br>you <span>see?</span></div>
          <a href="contact.html" class="cta-btn">Get in Touch &rarr;</a>
        </div>
      `;
      document.title = p.title + " — Erielle Amboy";
    }
